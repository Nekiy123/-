<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СмотрюTV — Вход</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <button class="theme-toggle auth-theme" id="themeToggle" aria-label="Сменить тему">🌙</button>

    <div class="auth-box">
        <h1>Смотрю<span class="logo-accent">TV</span></h1>
        <p class="auth-sub">Войдите или создайте аккаунт</p>

        <div class="tabs">
            <button type="button" id="tabReg" class="tab active">Регистрация</button>
            <button type="button" id="tabLogin" class="tab">Вход</button>
        </div>

        <form id="authForm" autocomplete="off">
            <div class="field" id="loginField">
                <label>Логин</label>
                <input type="text" id="login" placeholder="Ваш логин">
            </div>
            <div class="field">
                <label>Почта</label>
                <input type="email" id="email" placeholder="you@mail.ru" required>
            </div>
            <div class="field">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-main" id="submitBtn">Зарегистрироваться</button>
        </form>

        <p class="msg" id="msg"></p>
        <a href="index.html" class="back-link">← На главную</a>
    </div>

    <script src="script.js"></script>
</body>
            </html>
